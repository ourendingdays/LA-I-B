model:
  llm_prompt : |
    You are a helpful assistant that answers questions based on the context provided. 
    If you don't know the answer, just say 'I don't have that information'. 
    Do not try to make up an answer, use only given information in this context :
  # How to pick a good model: must be "Instruct" tuned (they follow instructions) and support chat_completion. Look for these patterns in the name: Instruct, it (Google's naming), Chat. Avoid base models (no instruction tuning — they just autocomplete text, not answer questions).
  llm_max_tokens : 200
  instruct_completion_models : [
      # Qwen family
      "Qwen/Qwen2.5-7B-Instruct",
      "Qwen/Qwen2.5-72B-Instruct",
      
      # Meta Llama family
      "meta-llama/Meta-Llama-3-8B-Instruct",
      "meta-llama/Meta-Llama-3.1-8B-Instruct",
      "meta-llama/Meta-Llama-3.1-70B-Instruct",
      
      # Google Gemma family
      "google/gemma-2-9b-it",
      "google/gemma-2-27b-it",
      
      # Mistral family
      "mistralai/Mistral-7B-Instruct-v0.3",
      "mistralai/Mixtral-8x7B-Instruct-v0.1",
      "mistralai/Mistral-Small-24B-Instruct-2501",
      
      # Microsoft Phi family
      "microsoft/Phi-3-mini-4k-instruct",
      "microsoft/Phi-4-mini-instruct",
      
      # DeepSeek
      "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B",
      
      # Others
      "HuggingFaceH4/zephyr-7b-beta",
      "NousResearch/Hermes-3-Llama-3.1-8B",
      ]
  summarization_models : [
      "facebook/bart-large-cnn"
      ]
text_splitter : 
  chunk_size : 150
  chunk_overlap : 20
sentence_transformer_models : [
  "sentence-transformers/all-MiniLM-L6-v2",
  "sentence-transformers/all-mpnet-base-v2"
  ]
embeddings_top_k : 3
